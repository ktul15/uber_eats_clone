name: Flutter CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # We will adjust these paths when the flutter project folders are created.
      # - run: cd customer_app && flutter pub get
      # - run: cd customer_app && flutter analyze
      # - run: cd customer_app && flutter test
