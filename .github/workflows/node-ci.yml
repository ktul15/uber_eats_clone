name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: uber_eats_clone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d uber_eats_clone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/uber_eats_clone_test
      TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/uber_eats_clone_test
      JWT_SECRET: ci-only-jwt-secret
      STRIPE_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test -- --runInBand --testPathIgnorePatterns=src/integration
      - run: npm run test:integration
